name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Compilar
        run: python -m compileall -q drive_downloader.py
      - name: Ayuda de la CLI
        run: python drive_downloader.py --help
